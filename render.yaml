services:
  - type: web
    name: nexusai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: CONFIDENCE_THRESHOLD
        value: "40"
      - key: DEBUG
        value: "false"
      # Optional AI fallback keys — set in Render dashboard, never commit:
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
